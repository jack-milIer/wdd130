<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic Quiz Form</title>
    <link rel="stylesheet" href="styles/quiz.css">
</head>

<body>
    <main>
        <h1>✅ Basic HTML and CSS Quiz</h1>
        <form action="">
            <div class="quiz-item">
                <label for="q1">1. What does CSS stand for?</label>
                <input type="text" id="q1" name="q1">
            </div>
            <div class="quiz-item">
                <label for="q2">2. How are ID and Class attributes selected in CSS?</label>
                <input type="text" id="q2" name="q2">
            </div>
            <div class="quiz-item">
                <label for="q3">3. Which of the following is a valid CSS comment?</label>
                <select id="q3" name="q3">
                    <option value="">Choose one...</option>
                    <option value="a">a</option>
                    <option value="b">a</option>
                    <option value="c">a</option>
                </select>
            </div>
            <div class="quiz-item">
                <label for="q4">4. What does CSS stand for?</label>
                <input type="text" id="q4" name="q4" required>
            </div>
            <button type="submit">Submit Quiz for Grading</button>
        </form>
    </main>
</body>

</html>
